name: Build and Deploy

on:
  schedule:
    - cron: "0 2 * * *"  # 毎日 JST 11:00 にビルド
  workflow_dispatch:       # 手動実行も可能

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 依存インストール
        run: pip install -r requirements.txt

      - name: Subsurface Cloud からデータ取得 & HTML 生成
        env:
          SUBSURFACE_EMAIL: ${{ secrets.SUBSURFACE_EMAIL }}
          SUBSURFACE_PASSWORD: ${{ secrets.SUBSURFACE_PASSWORD }}
        run: python src/build.py

      - name: GitHub Pages 用アーティファクトをアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/

      - name: GitHub Pages にデプロイ
        id: deployment
        uses: actions/deploy-pages@v4
